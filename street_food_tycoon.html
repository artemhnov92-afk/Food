<script>
// [эмодзи, название, базовая цена, с какого уровня открыт]
const P=[['🌭','Хот-дог',5,1],['🥤','Лимонад',4,1],['🍔','Бургер',12,3],['🍟','Фри',9,5],['🍕','Пицца',22,8],['🍦','Мороженое',16,11],['🍩','Пончик',14,15],['🌮','Тако',40,20]];
const NAMES=['Уличный киоск','Городской парк','Главная площадь','Набережная','Рынок','Вокзал','Пляж','Фестиваль','Торговый центр','Аэропорт'];
const $=id=>document.getElementById(id);
const DEF={coins:30,gems:3,lv:1,earn:0,sp:P.map(()=>0),pr:P.map(()=>0),traf:0,cap:0,cks:0,cooks:1,tut:0,ts:0,name:'',id:'',cheat:0,snd:1,vib:1,created:0,pt:0,sent:0,boost:0};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('sft1')||'{}'))}catch(e){}

const mult=()=>Math.pow(1.5,S.lv-1);
const goal=()=>Math.round(120*Math.pow(1.6,S.lv-1));
const un=i=>S.lv>=P[i][3];
const maxS=()=>3+S.cap;
const ct=i=>3/(1+.25*S.sp[i]);
const price=i=>P[i][2]*mult()*(1+.3*S.pr[i])*(S.boost>Date.now()?2:1);
const lname=()=>NAMES[(S.lv-1)%10]+(S.lv>10?' '+(Math.floor((S.lv-1)/10)+1):'');
function cost(t,i){const m=mult();
 if(t=='sp')return Math.round(P[i][2]*8*Math.pow(1.5,S.sp[i])*m);
 if(t=='pr')return Math.round(P[i][2]*10*Math.pow(1.55,S.pr[i])*m);
 if(t=='cooks')return Math.round(300*Math.pow(3.2,S.cooks-1)*m);
 if(t=='cks')return Math.round(100*Math.pow(1.7,S.cks)*m);
 if(t=='traf')return Math.round(60*Math.pow(1.6,S.traf)*m);
 return Math.round(80*Math.pow(1.7,S.cap)*m)}
function buy(t,i){const c=cost(t,i);if(S.coins<c)return;S.coins-=c;tone(660,.1,'triangle',.07);vib(10);if(t=='sp'||t=='pr')S[t][i]++;else S[t]++;render();hud()}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1800)}
function boost(){if(S.gems<1){toast('Нужен 💎 — их дают за уровни');return}S.gems--;S.boost=Math.max(S.boost,Date.now())+300000;toast('Доход x2 на 5 минут!');hud()}

// ---------- улучшения ----------
function render(){let h='';
 P.forEach((p,i)=>{if(!un(i))return;
  h+=`<div class="row"><span>${p[0]} Скорость <small>ур.${S.sp[i]+1}</small></span><button class="btn" ${S.coins<cost('sp',i)?'disabled':''} onclick="buy('sp',${i})">🪙 ${fmt(cost('sp',i))}</button></div>`;
  h+=`<div class="row"><span>${p[0]} Цена <small>ур.${S.pr[i]+1}</small></span><button class="btn" ${S.coins<cost('pr',i)?'disabled':''} onclick="buy('pr',${i})">🪙 ${fmt(cost('pr',i))}</button></div>`});
 h+=`<div class="row"><span>📣 Реклама (больше людей) <small>ур.${S.traf+1}</small></span><button class="btn" ${S.coins<cost('traf')?'disabled':''} onclick="buy('traf')">🪙 ${fmt(cost('traf'))}</button></div>`;
 h+=S.cooks<5?`<div class="row"><span>👨‍🍳 Нанять повара <small>(${S.cooks}/5)</small></span><button class="btn" ${S.coins<cost('cooks')?'disabled':''} onclick="buy('cooks')">🪙 ${fmt(cost('cooks'))}</button></div>`:'';
 h+=`<div class="row"><span>🧑‍🍳 Скорость повара <small>ур.${S.cks+1}</small></span><button class="btn" ${S.coins<cost('cks')?'disabled':''} onclick="buy('cks')">🪙 ${fmt(cost('cks'))}</button></div>`;
 h+=`<div class="row"><span>📦 Витрина (запас ${maxS()}) <small>ур.${S.cap+1}</small></span><button class="btn" ${S.coins<cost('cap')?'disabled':''} onclick="buy('cap')">🪙 ${fmt(cost('cap'))}</button></div>`;
 $('list').innerHTML=h}
function tog(){const s=$('sheet');s.hidden=!s.hidden;if(!s.hidden)render()}
setInterval(()=>{if(!$('sheet').hidden)render()},600);

// ---------- сцена ----------
const cv=$('c'),g0=cv.getContext('2d');let g=g0,s,LH,BG,BK='';
function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;s=innerWidth/360;LH=innerHeight/s;g0.setTransform(d*s,0,0,d*s,0,0);BK=''}
addEventListener('resize',rs);rs();
const ty=()=>LH*.3, cy=()=>ty()+26, y0=()=>Math.max(cy()+60,LH*.46);
const rr=(x,y,w,h,r,f)=>{g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=f;g.fill()};
let cs=[],fl=[],pt=[],st=P.map(()=>0),pg=P.map(()=>0),bp=P.map(()=>0),spawn=1,modal=false,hT=0,tm=0;
const HAIR=['#f6cf5a','#9a6a3d','#4a4350','#e08a5b','#efdca0'],SHIRT=['#7fcf8a','#6b7280','#7fa8f0','#f08a9a','#b59af0'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function newCust(){
 const free=[...Array(slots()).keys()].filter(k=>!cs.some(c=>c.k==k&&!c.o));if(!free.length)return;
 const ids=P.map((p,i)=>i).filter(un);
 let n=1+(Math.random()<Math.min(.7,.1+S.lv*.03)?1:0)+(Math.random()<.15&&S.lv>5?1:0);
 const od=[];for(let i=0;i<n;i++)od.push(rnd(ids));
 const k=rnd(free);
 const fr=Math.random()<.5;cs.push({k,tx:sx(k),x:fr?-20:380,y:ty(),yy:ty()-14,f:fr?1:-1,mv:true,o:0,od,g:0,t:0,pat:45,tk:0,h:rnd(HAIR),sh:rnd(SHIRT),pay:0});
}
function update(dt){
 P.forEach((p,i)=>{if(!un(i))return;
  if(st[i]<maxS()){pg[i]+=dt;if(pg[i]>=ct(i)){pg[i]=0;st[i]++}}
  bp[i]=Math.max(0,bp[i]-dt*4)});
 spawn-=dt;if(spawn<=0){spawn=Math.max(.7,4/(1+.2*S.traf)/(1+.04*S.lv));newCust()}
 cookAI(dt);
 cs.forEach(c=>{
  const d=c.tx-c.x;c.mv=!c.o&&Math.abs(d)>2;
  c.yy+=((c.o||c.mv?ty()-14:ty())-c.yy)*Math.min(1,dt*8);c.y=c.yy;
  if(c.o){if(!c.lv){c.lv=1;c.f=c.x<180?-1:1}c.x+=c.f*70*dt;return}
  if(c.mv){c.f=Math.sign(d);c.x+=c.f*Math.min(Math.abs(d),70*dt);return}
  if(c.fin>0){c.fin-=dt;if(c.fin<=0)pay(c);return}
  c.t+=dt;
  if(c.t>c.pat&&!c.bz){c.o=1;return}
  });
 cs=cs.filter(c=>c.x>-40&&c.x<400);
 fl.forEach(f=>{f.t+=dt;f.y-=dt*30});fl=fl.filter(f=>f.t<1);pt.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});pt=pt.filter(p=>p.t<.8);
 if(S.earn>=goal()&&!modal)levelDone();
}
function sph(x,y,r,col,c){c=c||g;c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();const q=c.createRadialGradient(x-r*.4,y-r*.4,r*.1,x,y,r);q.addColorStop(0,'rgba(255,255,255,.45)');q.addColorStop(.55,'rgba(255,255,255,0)');q.addColorStop(1,'rgba(0,0,0,.16)');c.fillStyle=q;c.fill()}
const HD=(()=>{const k=document.createElement('canvas');k.width=k.height=64;sph(32,32,30,'#fbd9b8',k.getContext('2d'));return k})();
const shd=(x,y,rx,ry)=>{g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()};
function bx(x,y,w,h,d,tp,a,b){
 shd(x+w/2+3,y+h+1,w/2+3,6);
 rr(x,y-d,w,d+8,8,tp);
 const q=g.createLinearGradient(0,y,0,y+h);q.addColorStop(0,a);q.addColorStop(1,b);
 rr(x,y,w,h,8,q);rr(x+2,y,w-4,4,2,'rgba(255,255,255,.35)')}

 shd(x,y+r*.8,r*1.1,r*.35);rr(x-3,y,6,r*.7,2,'#a3825a');
 sph(x,y-2,r,`hsl(${hue},40%,50%)`);sph(x-r*.5,y+3,r*.7,`hsl(${hue},45%,56%)`);sph(x+r*.5,y+2,r*.65,`hsl(${hue},45%,60%)`)}
function umb(x,y,r){
 shd(x+6,y+r*.9,r,r*.3);
 g.save();g.translate(x,y);g.scale(1,.8);
 for(let k=0;k<8;k++){g.fillStyle=k%2?'#fffaf0':'#8fc0ff';g.beginPath();g.moveTo(0,0);g.arc(0,0,r,k*.785,(k+1)*.785);g.fill()}
 const q=g.createRadialGradient(-r*.3,-r*.3,2,0,0,r);q.addColorStop(0,'rgba(255,255,255,.4)');q.addColorStop(1,'rgba(0,0,0,.16)');g.fillStyle=q;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}
function stat(){
 const hue=(100+S.lv*23)%360,t=ty(),c0=cy(),Y=y0();
 let q=g.createLinearGradient(0,0,0,LH);q.addColorStop(0,`hsl(${hue},45%,68%)`);q.addColorStop(1,`hsl(${hue},42%,56%)`);g.fillStyle=q;g.fillRect(0,0,360,LH);
 for(let i=0;i<14;i++){const x=(Math.sin(i*12.9)*.5+.5)*360,y=t+40+(Math.sin(i*7.3)*.5+.5)*(LH-t-40),r=30+(i%4)*14,b=g.createRadialGradient(x,y,0,x,y,r);b.addColorStop(0,'rgba(255,255,255,.16)');b.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=b;g.fillRect(x-r,y-r,2*r,2*r)}
 q=g.createLinearGradient(0,0,0,t-40);q.addColorStop(0,'#8995a6');q.addColorStop(1,'#7a8697');g.fillStyle=q;g.fillRect(0,0,360,t-40);
 for(let x=-20;x<360;x+=40)rr(x,t-62,22,3,1.5,'rgba(255,236,150,.9)');
 q=g.createLinearGradient(0,t-40,0,t+24);q.addColorStop(0,'#f3efe6');q.addColorStop(1,'#e0dbcd');g.fillStyle=q;g.fillRect(0,t-40,360,64);
 g.fillStyle='rgba(0,0,0,.05)';for(let x=0;x<360;x+=45)g.fillRect(x,t-37,1.5,58);g.fillRect(0,t+23,360,3);
 g.fillStyle='#fff';g.fillRect(0,t-40,360,3);
 tree(8,t+22,24,hue);tree(352,t+26,26,hue);
 const ye=Y+196;umb(55,ye+38,34);umb(305,ye+38,34);tree(180,ye+40,30,hue);
 {const w=slots()*56+24;bx(180-w/2,c0,w,14,12,'#fff4d6','#ffdfa6','#f0bd7a')}
 P.forEach((p,i)=>{const x=12+(i%4)*86,y=Y+Math.floor(i/4)*98,u=un(i);if(!u&&i>P.filter((q,j)=>un(j)).length)return;
  bx(x,y+14,78,70,14,u?'#fff4d6':'#e8e4d9',u?'#ffdfa6':'#d5d0c2',u?'#f0bd7a':'#b9b3a3');
  if(!u){g.textAlign='center';g.font='28px sans-serif';g.fillStyle='#000';g.fillText('🔒',x+39,y+8);g.font='bold 12px sans-serif';g.fillStyle='#7a7463';g.fillText('Ур. '+p[3],x+39,y+56)}})}
function mkbg(k){const d=Math.min(devicePixelRatio||1,2),o=document.createElement('canvas');o.width=Math.ceil(innerWidth*d);o.height=Math.ceil(innerHeight*d);const G=g;g=o.getContext('2d');g.setTransform(d*s,0,0,d*s,0,0);stat();g=G;BG=o;BK=k}
function car(x,y,col,dir){shd(x+17,y+17,20,4);
 rr(x,y,34,15,6,col);rr(x+8,y-5,18,9,4,col);g.fillStyle='#e3f4ff';g.fillRect(x+10,y-3,14,5);
 g.fillStyle='#4a4a5e';g.beginPath();g.arc(x+8,y+15,4,0,7);g.arc(x+26,y+15,4,0,7);g.fill();
 g.fillStyle='#fff3b0';g.fillRect(dir>0?x+32:x,y+4,3,4);rr(x,y,34,5,3,'rgba(255,255,255,.3)')}
function person(x,y,c,mv,pat){
 const sw=mv?Math.sin(tm*12+c.k*2):0,bob=mv?Math.abs(sw)*2:Math.sin(tm*2+c.k)*.8,ex=mv?(c.f||0)*2:0;
 shd(x,y+17,12,4.5);
 g.strokeStyle='#4a4a5e';g.lineWidth=4.5;g.lineCap='round';
 g.beginPath();g.moveTo(x-4,y+10);g.lineTo(x-4+sw*4,y+17);g.moveTo(x+4,y+10);g.lineTo(x+4-sw*4,y+17);g.stroke();
 rr(x-10,y-3-bob,20,17,7,c.sh);
 const q=g.createLinearGradient(x-10,0,x+10,0);q.addColorStop(0,'rgba(255,255,255,.3)');q.addColorStop(1,'rgba(0,0,0,.16)');g.fillStyle=q;g.fill();
 g.drawImage(HD,x-10,y-21-bob,20,20);
 g.beginPath();g.arc(x,y-13-bob,10.5,Math.PI,0);g.fillStyle=c.h;g.fill();
 g.fillStyle='#3a3340';g.fillRect(x-5+ex,y-11-bob,2.5,3.5);g.fillRect(x+2.5+ex,y-11-bob,2.5,3.5);
 g.strokeStyle='#b0634e';g.lineWidth=1.3;g.beginPath();
 if(pat<.4)g.arc(x+ex,y-3-bob,3,Math.PI*1.1,Math.PI*1.9);else g.arc(x+ex,y-6.5-bob,3,.15*Math.PI,.85*Math.PI);g.stroke()}
const CARS=[['#ff8fa3',40,1,0],['#7fb2ff',55,-1,150],['#ffd56b',70,1,260],['#8fdca0',48,-1,330],['#b69cff',62,1,380]];
function draw(){
 const k=S.lv+'|'+innerWidth+'|'+innerHeight;if(BK!=k)mkbg(k);
 const t=ty(),c0=cy(),Y=y0();
 g.drawImage(BG,0,0,360,LH);
 CARS.forEach(([c,sp,d,o])=>{const p=(tm*sp+o)%460;d>0?car(p-60,t-82,c,1):car(400-p,t-58,c,-1)});
 g.fillStyle='rgba(0,0,0,.05)';[[(tm*9)%520-80,LH*.55,90],[(tm*6+250)%520-80,LH*.8,110]].forEach(([x,y,r])=>{g.beginPath();g.ellipse(x,y,r,r*.42,0,0,7);g.fill()});
 cs.slice().sort((a,b)=>a.y-b.y).forEach(c=>{const x=c.x,y=c.y,mv=c.o||c.mv,r=1-c.t/c.pat;
  person(x,y,c,mv,r);
  if(!mv){const by=y-46+Math.sin(tm*3+c.k)*2,pop=Math.min(1,c.t*5);
   g.save();g.translate(x,by);g.scale(pop,pop);
   shd(2,19,13,4);
   g.fillStyle='#fff';g.beginPath();g.arc(0,0,17,0,7);g.fill();g.beginPath();g.moveTo(-6,13);g.lineTo(0,24);g.lineTo(4,14);g.fill();
   g.textAlign='center';g.font='20px sans-serif';g.fillStyle='#000';g.fillText(c.fin>0?'😋':P[c.od[c.g]][0],0,7);
   const left=c.od.length-c.g;if(left>1){g.font='bold 11px sans-serif';g.fillStyle='#555';g.fillText('×'+left,14,16)}
   rr(-14,-26,28,5,2,'rgba(0,0,0,.2)');rr(-14,-26,Math.max(1,28*r),5,2,r>.4?'#5fd99a':'#ff7a7a');
   g.restore()}});
 COOKS.forEach(K=>{const y=c0+30+(K.i%3)*7;person(K.x,y,{sh:['#7fa8f0','#f08a9a','#7fcf8a','#b59af0','#f6cf5a'][K.i%5],h:'#8a6a4a',k:9+K.i,f:K.f},K.mv,1);rr(K.x-8,y-27,16,6,3,'#fff');if(K.h>=0){g.textAlign='center';g.font='18px sans-serif';g.fillStyle='#000';g.fillText(P[K.h][0],K.x+K.f*14,y)}});
 P.forEach((p,i)=>{if(!un(i))return;const x=12+(i%4)*86,y=Y+Math.floor(i/4)*98,b=bp[i]*8,ck=st[i]<maxS();
  g.textAlign='center';shd(x+39,y+10,17,5);

 const go=x=>{const d=x-K.x;if(Math.abs(d)<3)return 1;K.f=Math.sign(d);K.x+=K.f*Math.min(Math.abs(d),150*v*dt);K.mv=true;return 0};
 if(K.s==0){const c=cs.find(c=>!c.o&&!c.mv&&!c.bz&&!c.fin&&c.g<c.od.length&&c.t>1.2&&st[c.od[c.g]]>0);
